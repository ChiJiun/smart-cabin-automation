name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # The server must start and serve the dashboard (catches a broken require or listen call).
      - name: Smoke test npm start
        shell: bash
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/state > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ | grep -q '<title>'
          curl -fsS http://127.0.0.1:3000/config.html | grep -q '<title>'
          curl -fsS http://127.0.0.1:3000/api/state | grep -q '"systemLevel":"NORMAL"'
          cat server.log

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智慧車載中控</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <h1>智慧車載電力與事件自動化系統</h1>
  <div class="clock" aria-label="模擬時鐘">
    <span class="dot" id="clockDot"></span>
    <span class="time" id="clockTime">T+00:00</span>
    <button class="btn sm" data-clock="toggle" id="clockToggle">暫停</button>
    <button class="btn sm" data-clock="step" data-sec="1">+1 秒</button>
    <button class="btn sm" data-clock="step" data-sec="5">+5 秒</button>
    <button class="btn sm" data-clock="step" data-sec="10">+10 秒</button>
  </div>
  <span class="spacer"></span>
  <a href="config.html">區域與設備配置 →</a>
</header>

<div class="layout">
  <main class="main">
    <div class="row2">
      <section class="panel" id="cockpit" aria-live="polite">
        <h2>座艙儀表 <span class="sub">Driver Display</span></h2>
        <div id="cockpitBody"></div>
      </section>
      <section class="panel" id="powerPanel">
        <h2>電力預算 <span class="sub">Power Budget</span></h2>
        <div id="powerBody"></div>
      </section>
    </div>
    <section class="panel">
      <h2>車輛區域與設備 <span class="sub">Zones &amp; Devices</span></h2>
      <div class="zones" id="zones"></div>
    </section>
  </main>

  <aside class="side">
    <section class="panel" id="ta">
      <h2>TA 模擬操作台 <span class="sub">Simulation Console</span></h2>

      <h3>預設情境（會先重置）</h3>
      <div class="ctl" id="scenarios"></div>

      <h3>行為 1：前方撞擊</h3>
      <div class="ctl">
        <label for="impactG">衝擊值</label>
        <input type="number" id="impactG" value="6" min="0" max="100" step="0.1"> g
        <button class="btn danger" data-act="impact">觸發前撞</button>
      </div>
      <div class="ctl">
        <button class="btn" data-act="cancelEcall" id="btnCancelEcall">取消 eCall</button>
        <button class="btn" data-act="clearIncident" id="btnClearIncident">解除事故</button>
      </div>

      <h3>行為 2：救護車</h3>
      <div class="ctl">
        <select id="sirenDir" aria-label="救護車方位">
          <option value="rear">後方</option><option value="front">前方</option>
          <option value="left">左側</option><option value="right">右側</option>
        </select>
        <button class="btn" data-act="sirenOn">周遭出現救護車</button>
        <button class="btn" data-act="sirenOff">救護車離開</button>
      </div>

      <h3>行為 3：盲區與方向燈</h3>
      <div class="ctl">
        <button class="btn" data-act="bs" data-side="left" id="bsLeft">左盲區有車</button>
        <button class="btn" data-act="bs" data-side="right" id="bsRight">右盲區有車</button>
      </div>
      <div class="ctl">
        <label>方向燈</label>
        <span class="seg">
          <button class="btn" data-act="ts" data-val="left" id="tsLeft">◀ 左</button>
          <button class="btn" data-act="ts" data-val="off" id="tsOff">關</button>
          <button class="btn" data-act="ts" data-val="right" id="tsRight">右 ▶</button>
        </span>
      </div>

      <h3>行為 4：剩餘里程</h3>
      <div class="ctl">
        <input type="number" id="rangeKm" value="25" min="0" max="1500"> km
        <button class="btn" data-act="setRange">回報里程</button>
        <button class="btn sm" data-range="8">8</button>
        <button class="btn sm" data-range="25">25</button>
        <button class="btn sm" data-range="33">33</button>
        <button class="btn sm" data-range="40">40</button>
      </div>

      <h3>行為 5：電力</h3>
      <div class="ctl">
        <label for="capacityW">發電機容量</label>
        <input type="number" id="capacityW" value="1000" min="0" max="10000" step="50"> W
        <button class="btn" data-act="setCapacity">設定</button>
      </div>
      <div class="ctl">
        <button class="btn" data-act="altFault" id="btnAlt">發電機故障</button>
      </div>

      <h3>行為 6：車外溫度</h3>
      <div class="ctl">
        <input type="range" id="ambient" min="-20" max="45" step="1" value="22" aria-label="車外溫度">
        <strong id="ambientVal">22 °C</strong>
      </div>

      <h3>設備故障注入</h3>
      <div class="ctl">
        <select id="faultDevice" aria-label="選擇設備"></select>
        <button class="btn" data-act="fault" data-val="1">注入故障</button>
        <button class="btn" data-act="fault" data-val="0">排除</button>
      </div>
      <div class="hint" id="faultList"></div>

      <h3>系統</h3>
      <div class="ctl">
        <button class="btn primary" data-act="reset">重置狀態</button>
        <button class="btn" data-act="factoryReset">恢復原廠配置</button>
      </div>
      <p class="hint">「重置狀態」保留目前的區域與設備配置；「恢復原廠配置」連配置一起還原。</p>
    </section>

    <section class="panel">
      <h2>車載日誌 <span class="sub">Event Log（新→舊）</span></h2>
      <ul class="log" id="log"></ul>
    </section>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
